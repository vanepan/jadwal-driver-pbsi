<!doctype html>
<html>
<head><meta charset="utf-8"><title>modal drawer harness</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/platform.css" />
</head>
<body style="margin:0;background:var(--bg,#F5F5F3);">
  <div style="padding:24px;">
    <p>Modal drawer harness host. The drawer itself mounts to &lt;body&gt; directly (matches production).</p>
  </div>

  <!-- Minimal stubs for the 4 satellite legacy modals, matching the real
       index.html ids modal.js's initModalHandlers()/Option-A flow depends
       on. Odometer/Cancel/OvertimeOverride are NOT part of this phase's
       migration — this harness only needs enough of their real markup to
       exercise the "detail closes first, reopens after" contract. -->
  <div class="modal-overlay" id="modalOdometer" style="display:none;">
    <div class="modal-box">
      <div class="modal-header"><h2 class="modal-title" id="odoModalTitle"></h2><button class="modal-close" id="btnCloseOdometer">&times;</button></div>
      <div class="modal-body">
        <p id="odoModalMeta" style="white-space:pre-line"></p>
        <label id="odoInputLabel"></label>
        <input id="odoInput" type="number" />
        <p id="odoHint"></p>
        <div id="odoPreview" style="display:none;">
          <span id="odoPreviewStart"></span><span id="odoPreviewEnd"></span><span id="odoPreviewDistance"></span>
        </div>
        <div class="form-actions">
          <button id="btnCancelOdometer">Batal</button>
          <button id="btnConfirmOdometer"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="modalCancel" style="display:none;">
    <div class="modal-box">
      <div class="modal-header"><h2 class="modal-title">Batalkan</h2><button class="modal-close" id="btnCloseCancel">&times;</button></div>
      <div class="modal-body">
        <textarea id="cancelReasonInput"></textarea>
        <span id="cancelReasonCounter"></span>
        <div class="form-actions">
          <button id="btnBackCancel">Kembali</button>
          <button id="btnConfirmCancel">Konfirmasi</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="modalOvertimeOverride" style="display:none;">
    <div class="modal-box">
      <div class="modal-header"><h2 class="modal-title">Override Lembur</h2><button class="modal-close" id="btnCloseOtOverride">&times;</button></div>
      <div class="modal-body">
        <p id="otOverrideContext"></p>
        <div id="otOverrideChoices">
          <input type="radio" name="otOverrideChoice" value="NORMAL" /><input type="radio" name="otOverrideChoice" value="LEMBUR" />
        </div>
        <textarea id="otOverrideReason"></textarea>
        <span id="otOverrideCounter"></span>
        <div class="form-actions">
          <button id="btnBackOtOverride">Kembali</button>
          <button id="btnConfirmOtOverride">Konfirmasi</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as modal from '/js/modal.js';

    const calls = [];
    const spy = (name) => (...args) => calls.push({ name, args });
    modal.registerEditCallback(spy('edit'));
    modal.registerDeleteCallback(spy('delete'));
    modal.registerStartCallback(spy('start'));
    modal.registerCompleteCallback(spy('complete'));
    modal.registerCommentCallback(spy('comment'));
    modal.registerCancelCallback(spy('cancel'));
    modal.registerOvertimeOverrideCallback(spy('override'));
    modal.initModalHandlers();

    window.__modalCalls = calls;
    window.__modal = modal;
    window.__modalHarnessReady = true;
  </script>
</body>
</html>
