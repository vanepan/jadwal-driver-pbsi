<!doctype html>
<html>
<head><meta charset="utf-8"><title>assignment form harness</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/platform.css" />
</head>
<body style="margin:0;background:var(--bg,#F5F5F3);">
  <div style="padding:24px;"><p>Assignment form harness — standalone (no app.js bootstrap, no Firebase auth listener), matches the Phase 2 modal-drawer-harness technique. Real js/assignments.js, real save-feedback.</p></div>

  <!-- ===== MODAL: FORM TAMBAH / EDIT ASSIGNMENT ===== (exact copy of index.html's #modalForm) -->
  <div class="modal-overlay" id="modalForm" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="modalFormTitle">Tambah Jadwal</h2>
        <button class="modal-close" id="btnCloseForm">&times;</button>
      </div>
      <div class="modal-body">
        <form id="assignmentForm" novalidate>
          <input type="hidden" id="fieldId" />
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldDriver">Driver *</label>
              <select id="fieldDriver" required>
                <option value="">-- Pilih Driver --</option>
                <option value="Dedi">Dedi</option>
                <option value="Grace">Grace</option>
              </select>
              <div class="dispatch-hint" id="assignmentDriverHint" hidden></div>
              <div class="sf-field-error" id="err-fieldDriver" hidden></div>
            </div>
            <div class="form-group">
              <label for="fieldPhone">Nomor HP</label>
              <input type="text" id="fieldPhone" placeholder="Otomatis terisi" readonly />
            </div>
            <div class="form-group form-full">
              <label for="fieldVehicle">Kendaraan *</label>
              <select id="fieldVehicle" required>
                <option value="">-- Pilih Kendaraan --</option>
                <option value="Avanza A">Avanza A</option>
                <option value="Avanza B">Avanza B</option>
              </select>
              <div class="dispatch-hint" id="assignmentVehicleHint" hidden></div>
              <div class="sf-field-error" id="err-fieldVehicle" hidden></div>
            </div>
            <div class="form-group multi-day-section">
              <label class="multi-day-checkbox-label">
                <input type="checkbox" id="assignmentMultiDay" />
                <span><span class="multi-day-checkbox-text">Multi Hari</span><span class="multi-day-hint">Beberapa hari berturut-turut</span></span>
              </label>
            </div>
            <div class="form-group full-day-section">
              <label class="multi-day-checkbox-label">
                <input type="checkbox" id="assignmentFullDay" />
                <span><span class="multi-day-checkbox-text">Penuh Hari</span><span class="multi-day-hint">Standby sepanjang hari</span></span>
              </label>
            </div>
            <div class="form-group">
              <label for="fieldDate" id="fieldDateLabel">Tanggal *</label>
              <input type="date" id="fieldDate" required />
              <div class="sf-field-error" id="err-fieldDate" hidden></div>
            </div>
            <div class="form-group end-date-wrapper" id="assignmentEndDateGroup">
              <label for="fieldEndDate">Tanggal Selesai *</label>
              <input type="date" id="fieldEndDate" />
              <div class="sf-field-error" id="err-fieldEndDate" hidden></div>
            </div>
            <div class="form-group time-pair-group" id="assignmentTimeStart">
              <label>Jam Mulai *</label>
              <div class="time-pair">
                <input type="text" id="fieldStartHour" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="HH" required />
                <span class="time-separator">:</span>
                <input type="text" id="fieldStartMinute" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" required />
              </div>
              <div class="sf-field-error" id="err-assignmentTimeStart" hidden></div>
            </div>
            <div class="form-group time-pair-group" id="assignmentTimeEnd">
              <label>Jam Selesai *</label>
              <div class="time-pair">
                <input type="text" id="fieldEndHour" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="HH" required />
                <span class="time-separator">:</span>
                <input type="text" id="fieldEndMinute" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" required />
              </div>
              <div class="sf-field-error" id="err-assignmentTimeEnd" hidden></div>
            </div>
            <div class="form-group form-full">
              <label for="fieldDestination">Tujuan *</label>
              <input type="text" id="fieldDestination" placeholder="Contoh: T3 Soetta – Pelatnas" required />
              <div class="sf-field-error" id="err-fieldDestination" hidden></div>
            </div>
            <div class="form-group form-full">
              <label for="fieldPurpose">Keperluan *</label>
              <input type="text" id="fieldPurpose" placeholder="Contoh: Penjemputan Kepulangan Pengurus" required />
              <div class="sf-field-error" id="err-fieldPurpose" hidden></div>
            </div>
            <div class="form-group">
              <label for="fieldPIC">PIC</label>
              <input type="text" id="fieldPIC" placeholder="Contoh: Pak Tommy" />
            </div>
            <div class="form-group">
              <label id="fieldPaxLabel">Jumlah Penumpang</label>
              <div class="pbsi-stepper" id="paxStepper" role="group" aria-labelledby="fieldPaxLabel">
                <button type="button" class="pbsi-stepper-btn" id="btnPaxMinus" aria-label="Kurangi penumpang" disabled>−</button>
                <input type="text" inputmode="numeric" pattern="[0-9]*" class="pbsi-stepper-display" id="paxDisplay" value="0" autocomplete="off" aria-labelledby="fieldPaxLabel" />
                <button type="button" class="pbsi-stepper-btn" id="btnPaxPlus" aria-label="Tambah penumpang">+</button>
                <input type="hidden" id="fieldPax" value="0" />
              </div>
            </div>
            <div class="form-group form-full">
              <label for="fieldNotes">Catatan</label>
              <textarea id="fieldNotes" rows="2" placeholder="Catatan tambahan (opsional)"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <div class="conflict-preview" id="conflictPreview" style="display:none;"></div>
            <div class="conflict-warning" id="conflictWarning" style="display:none;">
              ⚠️ Konflik jadwal! Driver atau kendaraan sudah digunakan di jam yang sama.
              <div class="conflict-warning-dates" id="conflictWarningDates"></div>
            </div>
            <div class="sf-inline-error" id="assignmentFormError" role="alert" hidden></div>
            <div class="form-actions-btns">
              <button type="button" class="btn-secondary" id="btnCancelForm">Batal</button>
              <button type="submit" class="btn-primary" id="btnSaveForm">Simpan</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Minimal timeline stand-in so a pulseTarget query can find a real node,
       matching the real .assignment-block[data-id] contract (js/timeline.js). -->
  <div id="timelineHost"><div class="assignment-block" data-id="sf-test-a1" style="width:120px;height:40px;background:#fff;border:1px solid #ccc;">Block</div></div>

  <!-- Design System Program Phase 5 — exact copy of index.html's #toast, so
       the canonical toast (js/components/toast.js) can be exercised here too. -->
  <div class="toast" id="toast" style="display:none;" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module">
    import * as mod from '/js/assignments.js';
    window.__assignMod = mod;
    localStorage.setItem('pbsi_current_user', JSON.stringify({ id: 'u1', username: 'admin1', name: 'Admin Test', role: 'admin' }));
    mod.initFormHandlers();
    window.__assignHarnessReady = true;
  </script>
</body>
</html>
