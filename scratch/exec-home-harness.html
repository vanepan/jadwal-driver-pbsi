<!doctype html>
<html>
<head><meta charset="utf-8"><title>exec home harness</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/platform.css" />
</head>
<body class="v2-shell-active" style="margin:0;background:var(--canvas,#F5F5F3);">
  <div id="host" class="exec-ui v2-analytics-claude" style="max-width:1400px;margin:0 auto;padding:24px;"></div>
  <script type="module">
    import { injectWorkspaceStyles } from '/js/workspace/workspace-styles.js';
    import { widgets } from '/js/widgets/executive/index.js';
    import { getWidgetDef } from '/js/workspace/widget-registry.js';

    window.__mountExecWidgets = (ctx, ids) => {
      injectWorkspaceStyles();
      const host = document.getElementById('host');
      const cards = ids.map((id) => {
        const def = getWidgetDef(id);
        const impl = widgets[id];
        const html = impl.render(ctx);
        if (def.variant === 'hero') {
          return `<section class="wsp-block wsp-block--hero wsp-span-full" data-widget-id="${id}"><div class="wsp-block__body">${html}</div></section>`;
        }
        return `<section class="wsp-block wsp-block--section wsp-span-full" data-widget-id="${id}">
          <header class="wsp-block__head"><h2 class="wsp-block__title">${def.title}</h2></header>
          <div class="wsp-block__body">${html}</div>
        </section>`;
      }).join('');
      host.innerHTML = `<div class="wsp-root"><div class="wsp-grid" role="list">${cards}</div></div>`;
      // Run onMount for widgets that need it (Hero's ring/count-up motion).
      ids.forEach((id) => {
        const impl = widgets[id];
        const card = host.querySelector(`[data-widget-id="${id}"]`);
        const body = card && card.querySelector('.wsp-block__body');
        if (body && typeof impl.onMount === 'function') impl.onMount(body, ctx);
      });
    };
    window.__execHarnessReady = true;
  </script>
</body>
</html>
