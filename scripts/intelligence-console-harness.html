<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sarpras Intelligence — Phase 4 console harness</title>
<!--
  Offline, isolated harness for scripts/intelligence-console-ui-check.mjs.
  It loads the REAL view (js/intelligence-console.js) but:
    • redirects js/auth.js + js/intelligence-backend-wiring.js (which pull in
      js/firebase.js and its https:// SDK imports) to tiny data: stubs, so
      nothing network-bound loads;
    • injects a SCRIPTED fake createIntelligenceService() into
      mountIntelligenceConsole(host, { controller }), so there is no Firebase,
      no OpenAI, no RTDB — the flow is fully deterministic.

  Phase 4: the fake service also implements getDraft / updateDraft over an
  in-memory record, so the review WORKSPACE (edit → Simpan Draf → reload)
  can be exercised end to end.
-->
<script type="importmap">
{
  "imports": {
    "/js/auth.js": "data:text/javascript,export function getCurrentUser(){return {username:'evan',role:'admin'};}",
    "/js/intelligence-backend-wiring.js": "data:text/javascript,export async function createWiredIntelligenceConsoleController(){throw new Error('harness: inject a controller');}export async function previewIntelligenceNorDraft(){throw new Error('harness: inject previewDraft');}"
  }
}
</script>
<style>
  html,body{margin:0;background:#fff}
  #host{padding:0}
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
  import { mountIntelligenceConsole } from '/js/intelligence-console.js';
  import { createIntelligenceConsoleController } from '/src/intelligence/console/intelligence-console-controller.js';
  import { RESPONSE_STATUS } from '/src/intelligence/contracts/intelligence-response-contract.js';

  const DRAFT_ID = 'draft_conv_harness';
  const NOR_ID = 'nor_conv_harness';
  const REC_KEY = 'sic.p4.harness.record';
  const NOR_KEY = 'sic.p5.harness.norRecord';

  // The one NOR-draft record the fake service "persists". It is also mirrored
  // into sessionStorage so a PAGE RELOAD restores it — standing in for the
  // real server-owned RTDB record the reload test depends on.
  const FACTS0 = { item: 'mesin potong rumput Honda GX35', quantity: '2 unit', purpose: 'perawatan lapangan PBSI', budget: 'Rp4 juta per unit' };
  const freshRecord = () => ({
    schema: 'intelligence-nor-draft@1', draftId: DRAFT_ID, conversationId: 'conv_harness',
    version: 1, ownerId: 'evan', status: 'requires_review',
    jenis: 'Pengadaan', subject: 'Pengadaan mesin potong rumput (2 unit)',
    recipient: 'Bendahara', recipientStatus: 'known', date: '2026-08-31',
    facts: { ...FACTS0 },
    body: 'Dengan hormat, bersama ini diajukan pengadaan mesin potong rumput sebanyak 2 unit untuk keperluan perawatan lapangan PBSI. Perkiraan anggaran Rp4 juta per unit. Mohon arahan lebih lanjut. Terima kasih.',
    numbering: { suggestedNumber: '', publishedNumber: null, source: 'system_suggested', basis: null, confidence: 0 },
    provenance: { bodySource: 'template' }, humanEdited: false,
    auditTrail: [{ type: 'AI_DRAFT_CREATED', at: 't', actorId: 'evan', changedFields: [] }],
    createdAt: 't', updatedAt: 't',
  });
  function loadRecord() {
    try { const s = sessionStorage.getItem(REC_KEY); if (s) return JSON.parse(s); } catch (e) { /* ignore */ }
    return freshRecord();
  }
  function saveRecord() { try { sessionStorage.setItem(REC_KEY, JSON.stringify(record)); } catch (e) { /* ignore */ } }
  let record = loadRecord();
  const FACT_KEYS = new Set(['item', 'quantity', 'unit', 'purpose', 'budget']);

  // Phase 5 — the canonical NorRecord the fake Registry "persists", mirrored
  // to sessionStorage so a reload restores its lifecycle stage.
  const contentFromDraft = () => ({
    jenis: record.jenis, subject: record.subject, recipient: record.recipient,
    recipientStatus: record.recipientStatus, date: record.date, body: record.body,
    bodySource: 'template', facts: { ...record.facts }, draftVersion: record.version,
  });
  const freshNorRecord = () => ({
    schema: 'nor-record@1', norId: NOR_ID, ownerId: 'evan', norNumber: '',
    sourceModule: 'intelligence', documentType: 'nor',
    status: 'in_review', currentVersion: 1, publishedVersion: null, numberSource: 'system_suggested',
    content: contentFromDraft(),
    metadata: { draftId: DRAFT_ID, conversationId: 'conv_harness', numberAllocation: null },
    versions: [{ version: 1, content: contentFromDraft() }],
    auditHistory: [{ type: 'AI_DRAFT_CREATED', at: 't', actorId: 'evan', version: 1 }],
  });
  function loadNorRecord() {
    try { const s = sessionStorage.getItem(NOR_KEY); if (s) return JSON.parse(s); } catch (e) { /* ignore */ }
    return freshNorRecord();
  }
  function saveNorRecord() { try { sessionStorage.setItem(NOR_KEY, JSON.stringify(norRecord)); } catch (e) { /* ignore */ } }
  let norRecord = loadNorRecord();
  let numberSeq = 6; // publish reserves 7, 8, …

  // Phase 6A — a generation-context scenario the NEXT reviewEnv() attaches
  // to the draft's fields.metadata (mirrors the real
  // intelligence-generation-context@1 shape closely enough for the console
  // UI check; the console never validates the shape itself — it only
  // renders whatever the server-authoritative context says).
  let genScenario = null; // null | 'certified' | 'fallback' | 'blocked'
  const GEN_SCENARIOS = {
    certified: {
      schema: 'intelligence-generation-context@1', mode: 'intelligence',
      gate: 'GENERATION_ALLOWED', status: 'generated', blocked: false,
      reasons: ['Every authoritative component resolved from approved organizational sources without conflict.'],
      generatedAt: 't', retrieval: { certification: 'certified', styleGuideStatus: 'resolved', visualTemplateStatus: 'resolved', documentType: 'NOR', retrievedAt: 't' },
      style: { slots: { opening: { slot: 'opening', source: 'certified_style_rule', ruleId: 'sgr_harness_1', version: 1, value: 'Dengan hormat,' } }, terminology: [], certifiedRuleIds: ['sgr_harness_1'], fallbacks: [] },
      visual: { source: 'approved_template', templateId: 'vtpl_harness_1', templateVersion: 1, variant: 'a4-v1' },
      fallbacks: [], conflicts: { styleGuide: [], visualTemplate: [] },
      snapshot: { styleRuleIds: ['sgr_harness_1'], visualTemplateIds: ['vtpl_harness_1'] },
    },
    fallback: {
      schema: 'intelligence-generation-context@1', mode: 'intelligence',
      gate: 'GENERATION_ALLOWED_WITH_FALLBACK', status: 'generated_with_fallback', blocked: false,
      reasons: ['No approved Style Guide rule exists for one or more wording slots; the established deterministic NOR wording was used.'],
      generatedAt: 't', retrieval: { certification: 'incomplete', styleGuideStatus: 'missing', visualTemplateStatus: 'resolved', documentType: 'NOR', retrievedAt: 't' },
      style: { slots: { opening: { slot: 'opening', source: 'deterministic_fallback', reason: 'not certified' } }, terminology: [], certifiedRuleIds: [], fallbacks: [{ slot: 'opening', reason: 'not certified' }] },
      visual: { source: 'approved_template', templateId: 'vtpl_harness_1', templateVersion: 1, variant: 'a4-v1' },
      fallbacks: [{ area: 'style', slot: 'opening', reason: 'not certified' }], conflicts: { styleGuide: [], visualTemplate: [] },
      snapshot: { styleRuleIds: [], visualTemplateIds: ['vtpl_harness_1'] },
    },
    blocked: {
      schema: 'intelligence-generation-context@1', mode: 'intelligence',
      gate: 'GENERATION_BLOCKED_INCOMPLETE', status: 'blocked_incomplete', blocked: true,
      reasons: ['Generation blocked: no approved Visual Template exists for this document type.'],
      generatedAt: 't', retrieval: { certification: 'incomplete', styleGuideStatus: 'resolved', visualTemplateStatus: 'missing', documentType: 'NOR', retrievedAt: 't' },
      style: { slots: {}, terminology: [], certifiedRuleIds: [], fallbacks: [] },
      visual: { source: 'deterministic_fallback', reason: 'no approved visual template' },
      fallbacks: [], conflicts: { styleGuide: [], visualTemplate: [] },
      snapshot: { styleRuleIds: [], visualTemplateIds: [] },
    },
  };

  const q = (id, questions) => ({
    conversationId: id,
    response: { schema: 'intelligence-response@1', requestId: 'r', status: RESPONSE_STATUS.NEEDS_INPUT, questions },
  });
  const reviewEnv = (id) => ({
    conversationId: id,
    draftId: DRAFT_ID,
    draftError: null,
    norId: NOR_ID,
    registryError: null,
    response: {
      schema: 'intelligence-response@1', requestId: 'r', status: RESPONSE_STATUS.REQUIRES_REVIEW,
      draft: { documentType: 'nor', fields: {
        norType: 'Pengadaan',
        subject: record.subject,
        recipient: record.recipient, recipientStatus: 'known',
        date: record.date,
        body: record.body,
        details: { ...record.facts },
        metadata: { bodySource: 'template', generationContext: genScenario ? GEN_SCENARIOS[genScenario] : null },
      } },
      review: { reason: 'Draf NOR memerlukan peninjauan dan persetujuan manusia sebelum diterbitkan.', blocking: true },
    },
  });
  const errEnv = (code) => ({
    conversationId: null,
    response: { schema: 'intelligence-response@1', requestId: 'r', status: RESPONSE_STATUS.ERROR, error: { code, message: 'Firebase: raw ' + code } },
  });

  // submit → 2 needs_input turns → review. One error step for the error-path
  // test. LAZY factories — evaluated at call time, not at page load — so
  // reviewEnv() picks up the CURRENT `record` / `genScenario` (Phase 6A: a
  // scenario set via setGenerationScenario() AFTER this array was built
  // must still take effect on the NEXT walk).
  const SCRIPT = [
    () => q('conv_harness', [
      { id: 'item', prompt: 'Barang apa yang akan diadakan?', why: 'Item', required: true },
      { id: 'quantity', prompt: 'Berapa jumlah unit yang dibutuhkan?', why: 'Jumlah', required: true },
    ]),
    () => q('conv_harness', [
      { id: 'recipient', prompt: 'NOR ini ditujukan kepada siapa?', why: 'Kepada', required: true },
    ]),
    () => reviewEnv('conv_harness'),
    () => errEnv('PROVIDER_ERROR'),
  ];
  let cursor = 0;
  const nextEnv = () => { const fn = SCRIPT[Math.min(cursor, SCRIPT.length - 1)]; cursor += 1; return fn(); };

  const H = {
    handleCalls: [], continueCalls: [], updateDraftCalls: [], getDraftCalls: [],
    getNorRecordCalls: [], syncNorRecordCalls: [], approveNorCalls: [], publishNorCalls: [],
    forceError: false,
  };
  const service = {
    async handle(request) { H.handleCalls.push(request); return H.forceError ? errEnv('PROVIDER_ERROR') : nextEnv(); },
    async continueSession(convId, answers, actor) { H.continueCalls.push({ convId, answers, actor }); return H.forceError ? errEnv('PROVIDER_ERROR') : nextEnv(); },
    async getDraft(id, actor) {
      H.getDraftCalls.push({ id, actor });
      if (id !== DRAFT_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      return { ok: true, draft: JSON.parse(JSON.stringify(record)) };
    },
    async updateDraft(id, edits, actor) {
      H.updateDraftCalls.push({ id, edits, actor });
      if (id !== DRAFT_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      const changed = [];
      for (const [k, v] of Object.entries(edits || {})) {
        const val = typeof v === 'string' ? v.trim() : v;
        if (FACT_KEYS.has(k)) { if (String(record.facts[k] ?? '') !== String(val)) changed.push(k); record.facts[k] = val; }
        else if (['recipient', 'subject', 'date', 'body'].includes(k)) { if (String(record[k] ?? '') !== String(val)) changed.push(k); record[k] = val; }
      }
      if (changed.length) {
        record.version += 1; record.humanEdited = true; record.updatedAt = 't' + record.version;
        record.auditTrail.push({ type: 'AI_DRAFT_EDITED', at: record.updatedAt, actorId: 'evan', changedFields: changed });
        saveRecord();
      }
      return { ok: true, draft: JSON.parse(JSON.stringify(record)) };
    },
    // ── Phase 5 — the canonical NOR Registry lifecycle ────────────────────
    async getNorRecord(id) {
      H.getNorRecordCalls.push({ id });
      if (id !== NOR_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      return { ok: true, record: JSON.parse(JSON.stringify(norRecord)) };
    },
    async syncNorRecord(id) {
      H.syncNorRecordCalls.push({ id });
      if (id !== NOR_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      if (norRecord.status !== 'in_review') return { ok: false, error: { code: 'ILLEGAL_TRANSITION', message: 'x' } };
      if (record.version !== norRecord.currentVersion) {
        norRecord.currentVersion = record.version;
        norRecord.content = contentFromDraft();
        norRecord.versions.push({ version: record.version, content: contentFromDraft() });
        norRecord.auditHistory.push({ type: 'AI_DRAFT_EDITED', at: 't', actorId: 'evan', version: record.version });
        saveNorRecord();
      }
      return { ok: true, record: JSON.parse(JSON.stringify(norRecord)) };
    },
    async approveNor(id, expectedVersion) {
      H.approveNorCalls.push({ id, expectedVersion });
      if (id !== NOR_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      if (norRecord.status === 'published') return { ok: false, error: { code: 'ALREADY_PUBLISHED', message: 'x' } };
      if (norRecord.status !== 'in_review') return { ok: false, error: { code: 'ILLEGAL_TRANSITION', message: 'x' } };
      if (typeof expectedVersion === 'number' && expectedVersion !== norRecord.currentVersion) return { ok: false, error: { code: 'VERSION_CONFLICT', message: 'x' } };
      norRecord.status = 'approved';
      norRecord.auditHistory.push({ type: 'AI_DRAFT_APPROVED', at: 't', actorId: 'evan', version: norRecord.currentVersion });
      saveNorRecord();
      return { ok: true, record: JSON.parse(JSON.stringify(norRecord)) };
    },
    async publishNor(id, expectedVersion) {
      H.publishNorCalls.push({ id, expectedVersion });
      if (id !== NOR_ID) return { ok: false, error: { code: 'NOT_FOUND', message: 'none' } };
      if (norRecord.status === 'published') return { ok: true, record: JSON.parse(JSON.stringify(norRecord)) }; // idempotent
      if (norRecord.status !== 'approved') return { ok: false, error: { code: 'ILLEGAL_TRANSITION', message: 'x' } };
      if (typeof expectedVersion === 'number' && expectedVersion !== norRecord.currentVersion) return { ok: false, error: { code: 'VERSION_CONFLICT', message: 'x' } };
      numberSeq += 1;
      norRecord.status = 'published';
      norRecord.norNumber = String(numberSeq);
      norRecord.numberSource = 'reserved';
      norRecord.publishedVersion = norRecord.currentVersion;
      norRecord.metadata.numberAllocation = { sequence: numberSeq, scopeKey: 'intelligence_nor', reservationKey: NOR_ID };
      norRecord.auditHistory.push({ type: 'NOR_NUMBER_RESERVED', at: 't', actorId: 'evan', version: norRecord.currentVersion });
      norRecord.auditHistory.push({ type: 'NOR_PUBLISHED', at: 't', actorId: 'evan', version: norRecord.currentVersion });
      saveNorRecord();
      return { ok: true, record: JSON.parse(JSON.stringify(norRecord)) };
    },
  };

  const controller = createIntelligenceConsoleController({ service, actor: { userId: 'evan', role: 'admin' } });
  H.controller = controller;
  H.getState = () => controller.getState();
  H.record = () => JSON.parse(JSON.stringify(record));
  H.norRecord = () => JSON.parse(JSON.stringify(norRecord));
  H.approve = () => controller.approve();
  H.publish = () => controller.publish();
  // Phase 6A — pick the generation-context scenario the NEXT requires_review
  // turn attaches. Set BEFORE walking to review (submit/answer); reset()
  // clears it back to null (legacy — no Phase 6A panel).
  H.setGenerationScenario = (name) => { genScenario = name || null; };

  // Phase 6C — a fake previewIntelligenceNorDraft + openDocument, injected
  // into mountIntelligenceConsole. No pdfmake, no Firebase: previewCalls /
  // openDocCalls record what the console asked for, previewScenario picks
  // the server freshness verdict the stub returns.
  let previewScenario = 'applied'; // applied | fallback | stale | invalid | error
  H.previewCalls = [];
  H.openDocCalls = [];
  H.setPreviewScenario = (name) => { previewScenario = name || 'applied'; };
  const PV = {
    applied: { status: 'applied', templateId: 'vtpl_h', templateVersion: 2, reason: null },
    fallback: { status: 'fallback', templateId: null, templateVersion: null, reason: 'none bound' },
    stale: { status: 'stale', templateId: 'vtpl_h', templateVersion: 1, reason: 'moved on' },
    invalid: { status: 'invalid', templateId: null, templateVersion: null, reason: 'malformed' },
  };
  const previewDraftStub = async (draftId) => {
    H.previewCalls.push({ draftId, scenario: previewScenario });
    if (previewScenario === 'error') return { ok: false, error: { code: 'PREVIEW_FAILED', message: 'stub: pratinjau gagal — render failed for ' + draftId } };
    return {
      ok: true,
      data: {
        composerData: {
          documentId: draftId, domainType: 'NOR — ' + record.jenis, version: record.version,
          statusLabel: 'Draf — menunggu peninjauan', approvedAt: null,
          sections: [{ field: 'perihal', value: record.subject }],
          renderingVisualModel: previewScenario === 'applied'
            ? { schema: 'nor-visual-rendering-model@1', source: 'approved_template', page: { width: 480, height: 720 }, margins: [40, 60, 40, 30], logo: { x: 380, y: 12, width: 50 } }
            : null,
          isPreview: true, disclaimerOverride: 'PRATINJAU internal — bukan dokumen resmi.',
        },
        previewVisual: PV[previewScenario],
      },
    };
  };
  const openDocumentStub = async (composerData, meta) => { H.openDocCalls.push({ composerData, meta }); };

  H.reset = () => {
    cursor = 0; H.handleCalls.length = 0; H.continueCalls.length = 0;
    H.updateDraftCalls.length = 0; H.getDraftCalls.length = 0;
    H.getNorRecordCalls.length = 0; H.syncNorRecordCalls.length = 0;
    H.approveNorCalls.length = 0; H.publishNorCalls.length = 0;
    H.previewCalls.length = 0; H.openDocCalls.length = 0; previewScenario = 'applied';
    H.forceError = false; genScenario = null;
    record = freshRecord(); norRecord = freshNorRecord(); numberSeq = 6;
    try { sessionStorage.removeItem('sic.p4.draftId'); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem(REC_KEY); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem(NOR_KEY); } catch (e) { /* ignore */ }
    controller.reset();
  };
  window.__harness = H;

  await mountIntelligenceConsole(document.getElementById('host'), {
    controller, previewDraft: previewDraftStub, openDocument: openDocumentStub,
  });
  window.__harnessReady = true;
</script>
</body>
</html>
