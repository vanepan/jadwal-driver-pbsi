<!doctype html><html><head><meta charset="utf-8"><title>drawer-pointer-safety</title>
<link rel="stylesheet" href="/platform.css">
<style>
  html,body { margin:0; height:100%; }
  /* a full-viewport target BEHIND where the drawer overlay would sit */
  #behind { position:fixed; inset:0; z-index:1; }
  #behind:focus-visible { outline:none; }
</style></head><body class="v2-analytics-claude app-ready v2-shell-active">
  <button id="behind" type="button">behind — the app content</button>
  <button id="trigger" type="button" style="position:relative;z-index:2">open drawer</button>
</body></html>
