<!doctype html><html><head><meta charset="utf-8"><title>odo-guard</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/platform.css">
</head>
<body class="app-ready">
<!-- #modalOdometer markup copied verbatim from index.html -->
<div class="modal-overlay" id="modalOdometer" style="display:none;">
  <div class="odo-modal">
    <div class="odo-modal__header">
      <div class="odo-modal__header-text">
        <h2 class="odo-modal__title" id="odoModalTitle">Mulai Assignment</h2>
        <p class="odo-modal__meta" id="odoModalMeta"></p>
      </div>
      <button class="odo-modal__close" id="btnCloseOdometer" aria-label="Tutup">&times;</button>
    </div>
    <div class="odo-modal__body">
      <label class="odo-field__label" for="odoInput" id="odoInputLabel">KM Awal</label>
      <div class="odo-field__inputwrap">
        <input class="odo-field__input" type="number" id="odoInput"
               inputmode="numeric" placeholder="0" min="0" step="1" autocomplete="off" />
        <span class="odo-field__lock" id="odoLock" title="Nilai resmi kendaraan — terkunci" hidden>&#128274;</span>
      </div>
      <button type="button" class="odo-field__correct" id="btnOdoCorrect" hidden>Koreksi odometer</button>
      <div class="odo-correct" id="odoCorrectBox" hidden>
        <label class="odo-field__label" for="odoCorrectReason">Alasan Koreksi</label>
        <textarea class="odo-field__reason" id="odoCorrectReason" rows="2" maxlength="200"
                  placeholder="Contoh: pembacaan odometer kendaraan sebelumnya tidak akurat"></textarea>
      </div>
      <span class="odo-field__error" id="odoHint"></span>
      <div class="odo-preview" id="odoPreview" style="display:none;">
        <div class="odo-preview__row">
          <span class="odo-preview__key">KM Awal</span>
          <span class="odo-preview__val" id="odoPreviewStart">—</span>
        </div>
        <div class="odo-preview__row">
          <span class="odo-preview__key">KM Akhir</span>
          <span class="odo-preview__val" id="odoPreviewEnd">—</span>
        </div>
        <div class="odo-preview__row odo-preview__row--total">
          <span class="odo-preview__key">Jarak Tempuh</span>
          <span class="odo-preview__val" id="odoPreviewDistance">—</span>
        </div>
      </div>
      <label class="odo-sanity" id="odoSanityWrap" hidden>
        <input type="checkbox" id="odoSanityAck" />
        <span>Saya sudah memeriksa, angka odometer sudah benar.</span>
      </label>
    </div>
    <div class="odo-modal__footer">
      <button type="button" class="odo-btn odo-btn--secondary" id="btnCancelOdometer">Batal</button>
      <button type="button" class="odo-btn odo-btn--primary" id="btnConfirmOdometer">Konfirmasi &amp; Mulai</button>
    </div>
  </div>
</div>
</body></html>
