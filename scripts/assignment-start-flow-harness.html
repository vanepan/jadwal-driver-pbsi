<!doctype html><html><head><meta charset="utf-8"><title>bug1</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/platform.css">
</head><body class="app-ready v2-shell-active">
<div id="host" style="padding:20px">driver dashboard stand-in <div id="driverDashboard" style="display:block"></div></div>

<!-- odometer modal markup, copied verbatim from index.html -->
<div class="modal-overlay" id="modalOdometer" style="display:none;">
  <div class="odo-modal">
    <div class="odo-modal__header">
      <div class="odo-modal__header-text">
        <h2 class="odo-modal__title" id="odoModalTitle">Mulai Assignment</h2>
        <p class="odo-modal__meta" id="odoModalMeta"></p>
      </div>
      <button class="odo-modal__close" id="btnCloseOdometer" aria-label="Tutup">&times;</button>
    </div>
    <div class="odo-modal__body">
      <label class="odo-field__label" for="odoInput" id="odoInputLabel">KM Awal</label>
      <input class="odo-field__input" type="number" id="odoInput" inputmode="numeric" placeholder="0" min="0" step="1" autocomplete="off" />
      <span class="odo-field__error" id="odoHint"></span>
      <div class="odo-preview" id="odoPreview" style="display:none;">
        <div class="odo-preview__row"><span class="odo-preview__key">KM Awal</span><span class="odo-preview__val" id="odoPreviewStart">—</span></div>
        <div class="odo-preview__row"><span class="odo-preview__key">KM Akhir</span><span class="odo-preview__val" id="odoPreviewEnd">—</span></div>
        <div class="odo-preview__row odo-preview__row--total"><span class="odo-preview__key">Jarak Tempuh</span><span class="odo-preview__val" id="odoPreviewDistance">—</span></div>
      </div>
    </div>
    <div class="odo-modal__footer">
      <button type="button" class="odo-btn odo-btn--secondary" id="btnCancelOdometer">Batal</button>
      <button type="button" class="odo-btn odo-btn--primary" id="btnConfirmOdometer">Mulai Assignment</button>
    </div>
  </div>
</div>
</body></html>
