<!DOCTYPE html>
<!-- individual-permission-management-harness.html — v1.30.9.6 Individual
     Permission Assignment, Phase 3A (User Management UX). Minimal harness:
     the real #modalUserForm markup, including the new
     #userIndividualPermissionsGroup section, copied verbatim from
     index.html. No full app.js boot — mirrors admin-pin-reset-harness.html
     for the same reason (admin.js's DOM lookups are all null-guarded;
     nothing else needs to be mounted). See
     scripts/individual-permission-management-dom-check.mjs. -->
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Individual Permission Management Harness</title>
</head>
<body>
<!-- js/utils.js#showToast() writes into this element; without it, toast
     calls are silent no-ops and the grant/revoke error path becomes
     unobservable to this test. -->
<div id="toast" style="display:none;"></div>
<div class="modal-overlay" id="modalUserForm" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="modalUserFormTitle">Tambah User</h2>
      <button class="modal-close" id="btnCloseUserForm">&times;</button>
    </div>
    <div class="modal-body">
      <form id="userForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="userFieldUsername">Username *</label>
            <input type="text" id="userFieldUsername" autocomplete="username" placeholder="Masukkan username" required />
          </div>
          <div class="form-group">
            <label for="userFieldDisplayName">Display Name *</label>
            <input type="text" id="userFieldDisplayName" placeholder="Nama tampilan" required />
          </div>
          <div class="form-group form-full">
            <label for="userFieldRole">Role *</label>
            <select id="userFieldRole" required>
              <option value="admin">Admin</option>
              <option value="bidang">Bidang</option>
              <option value="viewer">Viewer</option>
              <option value="driver">Driver</option>
              <option value="engineering">Engineering</option>
            </select>
            <p class="form-hint form-hint--warning" id="userRoleCurrentWarning" style="display:none;"></p>
            <div class="v2-dq-stats" id="userRoleSummaryPanel" style="display:none;"></div>
          </div>
          <div class="form-group form-full" id="userIndividualPermissionsGroup" style="display:none;">
            <div id="userIndividualPermissionsPanel"></div>
          </div>
          <div class="form-group form-full" id="userEngineeringLevelGroup" style="display:none;">
            <label>Tingkat Engineering *</label>
            <div class="eng-level-segment" style="display:flex;gap:10px;">
              <label class="multi-day-checkbox-label">
                <input type="checkbox" id="userEngKoordinator" data-eng-level="coordinator" />
                <span>
                  <span class="multi-day-checkbox-text">Koordinator</span>
                  <span class="multi-day-hint">Koordinasi lapangan &amp; verifikasi</span>
                </span>
              </label>
              <label class="multi-day-checkbox-label">
                <input type="checkbox" id="userEngAnggota" data-eng-level="member" />
                <span>
                  <span class="multi-day-checkbox-text">Anggota</span>
                  <span class="multi-day-hint">Pelaksana pekerjaan lapangan</span>
                </span>
              </label>
            </div>
          </div>
          <div class="form-group" id="userFieldPinGroup">
            <label for="userFieldPin">PIN *</label>
            <div class="pin-reveal-field">
              <input type="password" id="userFieldPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 digit PIN" autocomplete="off" required />
              <button type="button" class="pin-reveal-toggle" id="btnToggleUserFieldPin" aria-label="Tampilkan PIN" aria-pressed="false"></button>
            </div>
          </div>
          <div class="form-group form-full" id="userCredentialGroup" style="display:none;">
            <label>PIN</label>
            <div class="pin-credential-row">
              <span class="pin-credential-status">PIN tersimpan</span>
              <button type="button" class="btn-secondary" id="btnResetPinFromEdit">Reset PIN</button>
            </div>
          </div>
          <div class="form-group form-full">
            <label>Status Akun</label>
            <label class="pbsi-form-toggle">
              <input type="checkbox" id="userFieldActive" class="pbsi-toggle-input" role="switch" aria-label="Status akun aktif" checked />
              <span class="pbsi-form-toggle-label">Aktif</span>
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="btnCancelUserForm">Batal</button>
          <button type="submit" class="btn-primary" id="btnSaveUserForm">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
